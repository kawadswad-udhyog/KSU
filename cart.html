<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart | KAWAD SWAD Direct Store</title>
    <meta name="description" content="Review your selected KAWAD SWAD Jain Papads before proceeding to secure checkout.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://kawadswad.com/cart.html">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#FE330E">

    <!-- Master Design System Stylesheet (Handles Fonts & Global Theme) -->
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body class="flex flex-col min-h-screen">

    <!-- GLOBAL REUSABLE HEADER CONTAINER -->
    <header-component></header-component>

    <main class="flex-grow py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-12 text-center space-y-3">
                <span class="inline-block text-xs font-semibold uppercase tracking-widest text-[#4E342E] bg-[#FFFDE6] px-3 py-1 rounded-full border border-[#F3E6C8]">Review Order</span>
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-[#4E342E]">Shopping Cart</h1>
                <div class="w-12 h-0.5 bg-[#FBEC0A] mx-auto"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 items-start">
                <!-- Cart Items Table -->
                <div class="lg:col-span-2 bg-white rounded-[20px] border border-[#F3E6C8] p-6 shadow-xl overflow-x-auto">
                    <table class="w-full text-left text-sm" aria-label="Shopping Cart Items">
                        <thead class="bg-[#FFFDF7] text-[#4E342E] font-serif border-b border-[#F3E6C8]">
                            <tr>
                                <th scope="col" class="py-3 px-4 font-semibold">Product</th>
                                <th scope="col" class="py-3 px-4 font-semibold">Size</th>
                                <th scope="col" class="py-3 px-4 font-semibold">Quantity</th>
                                <th scope="col" class="py-3 px-4 font-semibold">Price</th>
                                <th scope="col" class="py-3 px-4 font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items-container" aria-live="polite" class="divide-y divide-[#F3E6C8]">
                            <!-- Items rendered dynamically via js/cart.js -->
                        </tbody>
                    </table>
                </div>

                <!-- Order Summary Sidebar -->
                <div class="bg-white rounded-[20px] border border-[#F3E6C8] p-8 shadow-xl space-y-6">
                    <h2 class="font-serif text-xl font-bold text-[#4E342E] border-b border-[#F3E6C8] pb-3">Order Summary</h2>
                    <div class="space-y-4 text-sm font-light">
                        <div class="flex justify-between text-[#5F5F5F]">
                            <span>Subtotal</span>
                            <span class="font-mono font-medium text-[#4E342E]" data-summary="subtotal">[Subtotal]</span>
                        </div>
                        <div class="flex justify-between text-[#5F5F5F]">
                            <span>Shipping Fee</span>
                            <span class="font-mono font-medium text-[#4E342E]" data-summary="shipping">[Shipping]</span>
                        </div>
                        <div class="pt-4 border-t border-[#F3E6C8] flex justify-between font-semibold text-[#4E342E] text-base">
                            <span>Total</span>
                            <span class="font-mono text-[#FE330E] font-bold text-lg" data-summary="total">[Total]</span>
                        </div>
                    </div>

                    <a href="checkout.html" class="block w-full text-center py-4 bg-[#FE330E] text-white text-xs font-semibold uppercase tracking-wider rounded-lg hover:bg-[#D92500] transition-colors duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E] shadow-lg">
                        Proceed to Checkout
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- GLOBAL REUSABLE FOOTER CONTAINER -->
    <footer-component></footer-component>

    <!-- JavaScript Engine Load -->
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
