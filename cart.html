<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart | KAWAD SWAD Direct Store</title>
    <meta name="description" content="Review your selected KAWAD SWAD Jain Papads before proceeding to secure checkout.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://kawadswad.com/cart.html">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#C5A059">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-cream text-brand-dark font-sans antialiased selection:bg-brand-gold selection:text-white flex flex-col min-h-screen">

    <header-component></header-component>

    <main class="flex-grow py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-12 text-center">
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-brand-dark mb-2">Shopping Cart</h1>
                <div class="w-12 h-0.5 bg-brand-gold mx-auto"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 items-start">
                <div class="lg:col-span-2 bg-white rounded-sm border border-stone-200/80 p-6 shadow-sm overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-brand-cream/50 text-brand-dark font-serif border-b border-stone-200">
                            <tr>
                                <th class="py-3 px-4">Product</th>
                                <th class="py-3 px-4">Size</th>
                                <th class="py-3 px-4">Quantity</th>
                                <th class="py-3 px-4">Price</th>
                                <th class="py-3 px-4">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-stone-200/80">
                            <!-- Items rendered dynamically via js/cart.js -->
                        </tbody>
                    </table>
                </div>

                <div class="bg-white rounded-sm border border-stone-200/80 p-6 shadow-sm space-y-6">
                    <h2 class="font-serif text-xl font-bold text-brand-dark border-b border-stone-200 pb-3">Order Summary</h2>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between text-brand-muted">
                            <span>Subtotal</span>
                            <span class="font-mono" data-summary="subtotal">[Subtotal]</span>
                        </div>
                        <div class="flex justify-between text-brand-muted">
                            <span>Shipping Fee</span>
                            <span class="font-mono" data-summary="shipping">[Shipping]</span>
                        </div>
                        <div class="pt-3 border-t border-stone-200 flex justify-between font-semibold text-brand-dark text-base">
                            <span>Total</span>
                            <span class="font-mono text-brand-gold" data-summary="total">[Total]</span>
                        </div>
                    </div>

                    <a href="checkout.html" class="block w-full text-center py-4 bg-brand-dark text-white text-xs font-semibold uppercase tracking-wider rounded-sm hover:bg-brand-gold transition-colors">
                        Proceed to Checkout
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer-component></footer-component>

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
