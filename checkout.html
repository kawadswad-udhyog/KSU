<!-- ========================================== -->
<!-- PHASE 3: SLIDE-OUT CART DRAWER COMPONENT   -->
<!-- ========================================== -->

<!-- Backdrop Overlay -->
<div id="cart-drawer-overlay" onclick="toggleCartDrawer(false)" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[200] opacity-0 pointer-events-none transition-opacity duration-300"></div>

<!-- Cart Drawer Panel -->
<aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-brand-bgSecondary border-l border-white/10 z-[210] transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
    
    <!-- Drawer Header -->
    <div class="p-5 glass-panel border-b border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-brand-accent"></i>
            <h3 class="font-heading font-extrabold text-base text-white">Your Tasting Basket</h3>
            <span id="drawer-item-count" class="bg-brand-accent/20 text-brand-accent text-xs font-bold px-2 py-0.5 rounded-full border border-brand-accent/30">1 Item</span>
        </div>
        <button onclick="toggleCartDrawer(false)" class="w-8 h-8 rounded-xl bg-brand-surface border border-white/10 flex items-center justify-center text-brand-textSecondary hover:text-white hover:border-brand-accent transition">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Free Shipping Progress Threshold -->
    <div class="bg-brand-surface/80 p-4 border-b border-white/5 space-y-2">
        <div class="flex justify-between text-xs font-semibold">
            <span id="shipping-progress-text" class="text-brand-accent flex items-center gap-1.5">
                <i data-lucide="truck" class="w-3.5 h-3.5"></i> Add ₹339 more for FREE Express Shipping!
            </span>
            <span id="shipping-progress-percent" class="text-brand-textSecondary font-mono">32%</span>
        </div>
        <div class="w-full bg-brand-bg h-2 rounded-full overflow-hidden border border-white/5">
            <div id="shipping-progress-bar" class="bg-gradient-to-r from-brand-accent to-amber-300 h-full w-[32%] transition-all duration-500 rounded-full"></div>
        </div>
    </div>

    <!-- Cart Items Scrollable List -->
    <div id="drawer-items-container" class="flex-1 overflow-y-auto p-5 space-y-4">
        <!-- Dynamic Cart Item Card -->
        <div class="glass-card p-4 rounded-2xl border border-white/10 flex gap-4 relative group">
            <img src="mascot3.png" alt="Moong Papad" class="w-16 h-16 object-contain rounded-xl bg-brand-surface p-1 border border-white/5 shrink-0" onerror="this.src='logo.png'">
            
            <div class="flex-1 space-y-1">
                <div class="flex justify-between items-start">
                    <h4 class="font-heading text-xs font-bold text-white leading-snug">Moong Special Khatta Meetha</h4>
                    <button onclick="removeItem(this)" class="text-brand-textSecondary/50 hover:text-brand-danger transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                <span class="text-[10px] text-brand-textSecondary font-mono block">Pack: 500g</span>

                <div class="flex justify-between items-center pt-2">
                    <!-- Qty Switcher -->
                    <div class="flex items-center glass-panel rounded-xl p-0.5 border border-white/10">
                        <button onclick="changeDrawerQty(-1)" class="w-6 h-6 rounded-lg bg-brand-surface flex items-center justify-center text-white text-xs hover:bg-brand-accent hover:text-black">-</button>
                        <span id="drawer-item-qty" class="w-8 text-center text-xs font-bold font-mono text-white">1</span>
                        <button onclick="changeDrawerQty(1)" class="w-6 h-6 rounded-lg bg-brand-surface flex items-center justify-center text-white text-xs hover:bg-brand-accent hover:text-black">+</button>
                    </div>

                    <span id="drawer-item-price" class="font-heading text-sm font-extrabold text-white">₹160</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Upsell Card inside Drawer -->
    <div class="px-5 py-3 bg-brand-surface/40 border-t border-white/5">
        <div class="glass-card p-3 rounded-2xl border border-brand-accent/20 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <span class="text-xl">🌶️</span>
                <div>
                    <span class="text-[11px] font-bold text-white block">Add Chana Masala (250g)</span>
                    <span class="text-[10px] text-brand-accent font-mono">+₹90 (Save ₹20)</span>
                </div>
            </div>
            <button onclick="triggerToast('Added Chana Masala Add-on!')" class="px-3 py-1.5 rounded-xl bg-brand-accent/20 text-brand-accent border border-brand-accent/30 text-[10px] font-bold hover:bg-brand-accent hover:text-black transition">
                + Add
            </button>
        </div>
    </div>

    <!-- Drawer Footer / Summary -->
    <div class="p-5 glass-panel border-t border-white/10 space-y-3">
        <div class="space-y-1.5 text-xs">
            <div class="flex justify-between text-brand-textSecondary">
                <span>Subtotal</span>
                <span id="drawer-subtotal" class="font-mono text-white font-semibold">₹160</span>
            </div>
            <div class="flex justify-between text-brand-textSecondary">
                <span>Estimated Shipping</span>
                <span id="drawer-shipping" class="font-mono text-brand-accent font-semibold">₹60</span>
            </div>
            <div class="flex justify-between text-sm font-bold pt-2 border-t border-white/10 text-white">
                <span>Total Amount</span>
                <span id="drawer-total" class="font-heading text-base font-extrabold text-brand-accent">₹220</span>
            </div>
        </div>

        <a href="checkout.html" class="w-full bg-brand-accent text-black font-heading font-bold py-3.5 rounded-2xl text-xs hover:bg-brand-accentLight transition-all shadow-lg shadow-brand-accent/20 flex items-center justify-center gap-2">
            <span>Proceed to Express Checkout</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </a>
    </div>
</aside>

<script>
    function toggleCartDrawer(open) {
        const drawer = document.getElementById('cart-drawer');
        const overlay = document.getElementById('cart-drawer-overlay');
        if (open) {
            drawer.classList.remove('translate-x-full');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        } else {
            drawer.classList.add('translate-x-full');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }
    }

    let drawerQty = 1;
    function changeDrawerQty(change) {
        drawerQty = Math.max(1, drawerQty + change);
        document.getElementById('drawer-item-qty').innerText = drawerQty;
        
        const price = 160 * drawerQty;
        document.getElementById('drawer-item-price').innerText = `₹${price}`;
        document.getElementById('drawer-subtotal').innerText = `₹${price}`;
        
        const shipping = price >= 499 ? 0 : 60;
        document.getElementById('drawer-shipping').innerText = shipping === 0 ? 'FREE' : '₹60';
        document.getElementById('drawer-total').innerText = `₹${price + shipping}`;

        // Progress bar update
        const remaining = Math.max(0, 499 - price);
        const percent = Math.min(100, Math.round((price / 499) * 100));
        document.getElementById('shipping-progress-percent').innerText = `${percent}%`;
        document.getElementById('shipping-progress-bar').style.width = `${percent}%`;
        
        if (remaining === 0) {
            document.getElementById('shipping-progress-text').innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5 text-brand-success"></i> You Unlocked FREE Express Shipping!`;
        } else {
            document.getElementById('shipping-progress-text').innerHTML = `<i data-lucide="truck" class="w-3.5 h-3.5"></i> Add ₹${remaining} more for FREE Delivery!`;
        }
        lucide.createIcons();
    }
</script>
