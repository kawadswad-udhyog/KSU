        <!-- Right Controls: Search, Cart & Mobile Menu Button -->
        <div class="flex items-center space-x-1 sm:space-x-3">
            <!-- Search Button -->
            <a href="shop.html" class="text-[#4E342E] hover:text-[#FE330E] transition-colors duration-200 p-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E] rounded-full" aria-label="Search Products">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">

            <!-- Mobile Menu Toggle Button -->
            <button type="button" id="mobile-menu-btn" aria-controls="mobile-menu" aria-expanded="false" class="lg:hidden p-2 text-[#4E342E] hover:text-[#FE330E] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E] rounded-lg transition-colors duration-200" aria-label="Toggle Navigation Menu">

    <!-- Mobile Navigation Dropdown -->

        <a href="blog.html" class="block py-2.5 px-3 hover:bg-[#F3E6C8]/40 hover:text-[#FE330E] transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E] rounded-lg">Blog</a>

    </div>
</header>

<!-- JavaScript for Mobile Menu Interaction -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const iconHamburger = document.getElementById('icon-hamburger');
        const iconClose = document.getElementById('icon-close');

        if (menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
                
                // Toggle state
                menuBtn.setAttribute('aria-expanded', !isExpanded);
                mobileMenu.classList.toggle('hidden');
                
                // Toggle icons
                iconHamburger.classList.toggle('hidden');
                iconClose.classList.toggle('hidden');
            });
        }
    });
</script>
