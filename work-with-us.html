<body class="flex flex-col min-h-screen">

  <header-component></header-component>

  <main class="flex-grow">
    <!-- HERO SECTION -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-content slide-up">
          <span class="section-tagline">Join Our Journey</span>
          <h1 class="hero-title">Build Your Career With KAWAD SWAD</h1>
          <p class="hero-subtitle">We're building one of India's fastest-growing traditional food brands. Join us and grow together.</p>
          <div class="hero-btn-group">
            <a href="#open-positions" class="btn btn-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E] cta-positions">
              <i class="fa-solid fa-briefcase" aria-hidden="true"></i> View Open Positions
            </a>
            <a href="#apply-form" class="btn btn-secondary focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E] cta-apply">
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Apply Now
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- (Keep sections: WHY WORK WITH US, LIFE AT KAWAD SWAD, OPEN POSITIONS, HIRING PROCESS, BENEFITS) -->

    <!-- APPLICATION FORM -->
    <section class="apply-section" id="apply-form">
      <div class="container">
        <div class="card form-container">
          <!-- UPDATED FORM ATTRIBUTE -->
          <form id="careerForm" data-form="career" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="name" class="form-control" placeholder="Enter your full name" required>
              </div>
              <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="mobile" class="form-control" placeholder="Enter 10-digit mobile number" required>
              </div>
              <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
              </div>
              <div class="form-group">
                <label for="city">City / Location *</label>
                <input type="text" id="city" name="city" class="form-control" placeholder="Current city" required>
              </div>
              <div class="form-group">
                <label for="position">Position Applying For *</label>
                <select id="position" name="position" class="form-control" required>
                  <option value="" disabled selected>Select a position</option>
                  <option value="Production Executive">Production Executive</option>
                  <option value="Sales Executive">Sales Executive</option>
                  <option value="Quality Control Executive">Quality Control Executive</option>
                  <option value="Warehouse Executive">Warehouse Executive</option>
                  <option value="Other / General Application">Other / General Application</option>
                </select>
              </div>
              <div class="form-group">
                <label for="experience">Total Experience *</label>
                <select id="experience" name="experience" class="form-control" required>
                  <option value="" disabled selected>Select experience level</option>
                  <option value="Fresher">Fresher (0 Years)</option>
                  <option value="1-2 Years">1 - 2 Years</option>
                  <option value="3-5 Years">3 - 5 Years</option>
                  <option value="5+ Years">5+ Years</option>
                </select>
              </div>
              <div class="form-group full-width">
                <label for="resume">Resume Upload (PDF / DOCX)</label>
                <div class="file-upload-wrapper">
                  <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                  <div class="file-upload-icon"><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i></div>
                  <div class="file-upload-text" id="fileText">Drag &amp; drop your resume file here or click to browse</div>
                </div>
              </div>
              <div class="form-group full-width">
                <label for="message">Cover Note / Message</label>
                <textarea id="message" name="message" class="form-control" maxlength="500" placeholder="Tell us briefly about your background and why you wish to join KAWAD SWAD..."></textarea>
              </div>
              <div class="form-group full-width text-center" style="margin-top: 1rem;">
                <button type="submit" class="submit-btn btn btn-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FE330E]" style="width: 100%; max-width: 300px; margin: 0 auto;">
                  Submit Application
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer-component></footer-component>

  <script src="js/layout.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>

  <script>
    function preselectPosition(jobTitle) {
      const select = document.getElementById('position');
      if (select) select.value = jobTitle;
    }

    function toggleFaq(element) {
      element.classList.toggle('active');
    }

    // UPDATED SCRIPT LOGIC FOR CAREER FORM
    const resumeInput = document.getElementById('resume');
    const fileText = document.getElementById('fileText');
    if (resumeInput && fileText) {
      resumeInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          fileText.textContent = `Selected file: ${e.target.files[0].name}`;
        }
      });
    }
  </script>
</body>
</html>
